# Base compose file.
# Traefik is the gateway, all requests from the browser go through it on port 8080.
# Networks:
#   public       Traefik only, the only network with a published port
#   backend      Traefik and all services (internal, no internet)
#   <name>-db-net one service and its database or cache (internal)
# To enable your service, uncomment its blocks here, in volumes, networks and in docker-compose.dev.yml.
# Service URLs like ${MOVIES_URL:-http://movies:8080} use the container by default,
# the dev menu sets them to host.docker.internal when that service runs locally.

services:
  traefik:
    image: traefik:v3
    command:
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      # Traefik talks to services over the backend network
      - --providers.docker.network=m3d_backend
      # Shared middlewares are in traefik/dynamic.yml
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      - "8080:80"
    environment:
      # USERS_URL is only set by the dev menu when users runs locally
      AUTH_URL: ${USERS_URL:-http://users:8080}/auth/verify
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik:/etc/traefik/dynamic:ro
    networks:
      - public
      - backend

  users:
    build: ./backend/users
    environment:
      PORT: 8080
      DB_URL: postgres://m3d_users:${USERS_DB_PASSWORD}@users-db:5432/m3d_users
      JWT_SECRET: ${JWT_SECRET}
      NOTIFICATIONS_URL: ${NOTIFICATIONS_URL:-http://notifications:8080}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      CACHE_URL: redis://users-cache:6379
      CACHE_TTL_SECONDS: 300
    depends_on:
      users-db:
        condition: service_healthy
      users-cache:
        condition: service_started
    networks:
      - backend
      - users-db-net
    labels:
      - traefik.enable=true
      - traefik.http.services.users.loadbalancer.server.port=8080

      # Protected: everything else under /api/users
      - traefik.http.routers.users.rule=PathPrefix(`/api/users`)
      - traefik.http.routers.users.middlewares=auth@file,strip-api@file

      # Public: register, login and refresh
      - traefik.http.routers.users-public.rule=Path(`/api/users/register`) || Path(`/api/users/login`) || Path(`/api/users/refresh`)
      - traefik.http.routers.users-public.middlewares=strip-api@file

      # Public: health and swagger, /api/users/docs/ becomes /docs/
      - traefik.http.routers.users-docs.rule=Path(`/api/users/health`) || PathPrefix(`/api/users/docs`) || Path(`/api/users/openapi.json`)
      - traefik.http.routers.users-docs.middlewares=users-strip
      - traefik.http.middlewares.users-strip.stripprefix.prefixes=/api/users

  users-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: m3d_users
      POSTGRES_USER: m3d_users
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
    volumes:
      - users-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m3d_users -d m3d_users"]
      interval: 5s
      retries: 10
    networks:
      - users-db-net

  # Valkey cache for users, only users can reach it (same network as its database)
  users-cache:
    image: valkey/valkey:8-alpine
    # Only a cache, nothing is saved to disk
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    networks:
      - users-db-net

