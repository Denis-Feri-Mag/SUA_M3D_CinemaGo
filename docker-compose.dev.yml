# Local dev overrides, published ports for testing.
# Run with .\dev.ps1 or ./dev.sh (same as
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build)
#
# Internal networks cannot publish ports, so in dev every service
# and database also joins the normal "dev" network.
# Uncomment your service and database below when you enable them in docker-compose.yml.
#
# extra_hosts lets containers reach services running locally on your machine
# as host.docker.internal (needed on Linux, Docker Desktop has it built in).

services:
  # Traefik dashboard on http://localhost:8090
  traefik:
    ports:
      - "8090:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  users:
    ports:
      - "8081:8080"
    networks:
      - dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
  users-db:
    ports:
      - "5432:5432"
    networks:
      - dev

