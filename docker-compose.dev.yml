# Local dev overrides, published ports for testing.
# Run with .\dev.ps1 or ./dev.sh (same as
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build)
#
# Internal networks cannot publish ports, so in dev every service
# and database also joins the normal "dev" network.
# Uncomment your service and database below when you enable them in docker-compose.yml.
#
# Running one service locally:
# Start the rest with compose, then point that service's env URLs at
# host.docker.internal (the host machine from inside a container).
# On Linux, add this so the name resolves:
#   extra_hosts:
#     - "host.docker.internal:host-gateway"

services:
  # Traefik dashboard on http://localhost:8090
  traefik:
    ports:
      - "8090:8080"

  users:
    ports:
      - "8081:8080"
    networks:
      - dev
  users-db:
    ports:
      - "5432:5432"
    networks:
      - dev

